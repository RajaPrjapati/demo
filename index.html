<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }

    /* Navbar styling */
    .navbar {
      background-color: #24292e;
      display: flex;
      justify-content: center;
      padding: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .nav-btn:hover {
      background-color: #3f4448;
    }
    .nav-btn.active {
      background-color: #2da44e;
      font-weight: bold;
    }

    /* Container layout */
    .content-container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Form styling */
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #2da44e;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #2c974b;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <button class="nav-btn active" onclick="showTab('form')">Registration Form</button>
    <button class="nav-btn" onclick="showTab('data')">Registration Data</button>
  </nav>

  <div class="content-container">
    
    <!-- Tab 1: Registration Form -->
    <div id="form" class="tab-content active">
      <h2>Registration Form</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter full name" required />
